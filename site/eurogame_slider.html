<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0b0e; color: #fff; padding: 20px; }
  .box { background: #131722; border: 1px solid rgba(197, 160, 89, 0.3); border-radius: 12px; padding: 24px; max-width: 600px; margin: auto; }
  h3 { color: #c5a059; margin-top: 0; }
  .slider-row { margin: 18px 0; }
  label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
  input[type=range] { width: 100%; accent-color: #c5a059; }
  .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; background: rgba(0,0,0,0.3); padding: 14px; border-radius: 8px; }
  .res-item strong { display: block; color: #e5c98e; font-size: 1.2rem; }
  .res-item span { font-size: 0.75rem; color: #94a3b8; }
</style>
</head>
<body>
<div class="box">
  <h3>🎲 Simulador Eurogame de Alavancagem na Planta</h3>
  <div class="slider-row">
    <label>Valor do Imóvel Lavvi: <span id="vVal">R$ 1.500.000</span></label>
    <input type="range" id="slValor" min="500000" max="6000000" step="50000" value="1500000">
  </div>
  <div class="slider-row">
    <label>Taxa Selic Anual Estimada: <span id="sVal">10.5%</span></label>
    <input type="range" id="slSelic" min="8" max="15" step="0.25" value="10.5">
  </div>
  <div class="res-grid">
    <div class="res-item">
      <span id="resDes">R$ 525.000</span>
      <span>Desembolso Obra (35%)</span>
    </div>
    <div class="res-item">
      <span id="resGanho" style="color: #10b981;">R$ 218.450</span>
      <span>Juros Ganhos no CDI Preservado</span>
    </div>
    <div class="res-item">
      <span id="resEfetivo" style="color: #38bdf8;">R$ 306.550</span>
      <span>Custo Líquido Efetivo</span>
    </div>
    <div class="res-item">
      <span id="resAsim" style="color: #a855f7;">41.6%</span>
      <span>Subsídio Real via CDI</span>
    </div>
  </div>
</div>
<script>
  function update() {
    const v = parseFloat(document.getElementById('slValor').value);
    const s = parseFloat(document.getElementById('slSelic').value) / 100;
    document.getElementById('vVal').innerText = "R$ " + v.toLocaleString('pt-BR');
    document.getElementById('sVal').innerText = (s * 100).toFixed(2) + "%";
    const desembolso = v * 0.35;
    const jurosEstimados = v * (Math.pow(1 + s * 0.85, 3) - 1) * 0.45;
    const efetivo = desembolso - jurosEstimados;
    document.getElementById('resDes').innerText = "R$ " + Math.round(desembolso).toLocaleString('pt-BR');
    document.getElementById('resGanho').innerText = "R$ " + Math.round(jurosEstimados).toLocaleString('pt-BR');
    document.getElementById('resEfetivo').innerText = "R$ " + Math.round(efetivo).toLocaleString('pt-BR');
    document.getElementById('resAsim').innerText = ((jurosEstimados / desembolso) * 100).toFixed(1) + "%";
  }
  document.getElementById('slValor').oninput = update;
  document.getElementById('slSelic').oninput = update;
  update();
</script>
</body>
</html>
