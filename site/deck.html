  <style>
    :root {
      --bg-dark: #0a0c10;
      --card-bg: #141720;
      --gold-primary: #d4af37;
      --gold-light: #f5e6b3;
      --text-main: #f0f3f6;
      --text-muted: #9aa0a6;
      --border-subtle: rgba(212, 175, 55, 0.2);
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }

    /* Top Navigation Toolbar */
    .deck-top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(10, 12, 16, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--gold-primary);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
    }

    .deck-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .project-selector {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-family: var(--font-sans);
      cursor: pointer;
      outline: none;
    }

    .btn-action {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 8px 16px;
      min-height: 44px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      text-decoration: none;
      touch-action: manipulation;
    }

    .btn-action:hover {
      background: rgba(212, 175, 55, 0.2);
      border-color: var(--gold-primary);
      color: var(--gold-light);
    }

    .btn-action-gold {
      background: var(--gold-primary);
      color: #0a0c10;
      font-weight: 600;
      border-color: var(--gold-primary);
    }

    .btn-action-gold:hover {
      background: var(--gold-light);
      color: #000;
    }

    /* Main Deck Stage */
    .deck-stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 70px 20px 60px 20px;
    }

    .slide-viewport {
      width: 100%;
      max-width: 1380px;
      height: 100%;
      max-height: 776px;
      aspect-ratio: 16 / 9;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
    }

    /* Individual Slide */
    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
      transform: scale(0.98);
      display: flex;
      flex-direction: column;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    /* Cover Slide Style */
    .slide-cover {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 60px;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .slide-cover::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10,12,16,0.3) 0%, rgba(10,12,16,0.7) 50%, rgba(10,12,16,0.95) 100%);
    }

    .cover-content {
      position: relative;
      z-index: 2;
      max-width: 900px;
    }

    .cover-tag {
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold-primary);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .cover-title {
      font-family: var(--font-serif);
      font-size: 56px;
      line-height: 1.1;
      color: #fff;
      margin-bottom: 16px;
    }

    .cover-subtitle {
      font-size: 18px;
      color: var(--text-muted);
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .cover-footer {
      display: flex;
      align-items: center;
      gap: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 20px;
    }

    .broker-info {
      font-size: 14px;
      color: var(--gold-light);
    }

    .broker-info strong {
      color: #fff;
      display: block;
      font-size: 16px;
    }

    /* Content Slide (Split 50/50 Layout) */
    .slide-split {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      height: 100%;
    }

    .slide-split-reversed {
      grid-template-columns: 1fr 1.1fr;
    }

    .split-text {
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #11141b;
      position: relative;
    }

    .split-text::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, rgba(212,175,55,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .slide-category {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-primary);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .slide-title {
      font-family: var(--font-serif);
      font-size: 38px;
      color: #fff;
      margin-bottom: 16px;
      line-height: 1.15;
    }

    .slide-desc {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 8px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 8px;
      padding: 14px;
    }

    .stat-val {
      font-family: var(--font-serif);
      font-size: 26px;
      color: var(--gold-light);
      margin-bottom: 4px;
    }

    .stat-lbl {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .split-media {
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .split-media::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(17,20,27,0.4) 0%, transparent 40%);
    }

    .media-caption {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(10, 12, 16, 0.8);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      color: var(--gold-light);
      border: 1px solid var(--border-subtle);
    }

    /* Financial Table Slide */
    .finance-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 13px;
    }

    .finance-table th {
      text-align: left;
      padding: 10px;
      background: rgba(212, 175, 55, 0.1);
      color: var(--gold-light);
      font-weight: 600;
      border-bottom: 1px solid var(--border-subtle);
    }

    .finance-table td {
      padding: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    /* Bottom Navigation Bar */
    .deck-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      min-height: 54px;
      padding-bottom: max(6px, env(safe-area-inset-bottom, 0px));
      padding-left: max(24px, env(safe-area-inset-left, 0px));
      padding-right: max(24px, env(safe-area-inset-right, 0px));
      background: rgba(10, 12, 16, 0.85);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }

    .slide-progress {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .nav-arrow-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-nav-arrow {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s;
      touch-action: manipulation;
    }

    .btn-nav-arrow:hover {
      background: var(--gold-primary);
      color: #0a0c10;

      }

        width: 100vw !important;

        display: flex !important;

  </style>

      if (idx >= slides.length) idx = slides.length - 1;

      const viewport = document.getElementById('slideViewport');
      viewport.innerHTML = '';

      const s = slides[idx];
      const slideEl = document.createElement('div');

        slideEl.className += ' slide-cover';
        slideEl.style.backgroundImage = `url('${s.bg}')`;

              </div>
            </div>
          </div>

        const statsHtml = s.stats ? s.stats.map(st => `
          <div class="stat-card">
            <div class="stat-val">${st.val}</div>
            <div class="stat-lbl">${st.lbl}</div>
          </div>
        `).join('') : '';

        const textCol = `
          <div class="split-text">
            <div class="slide-category">${s.category}</div>
            <h2 class="slide-title">${s.title}</h2>
            <p class="slide-desc">${s.desc}</p>
            <div class="stats-grid">${statsHtml}</div>
          </div>
        `;

        const mediaCol = `
          <div class="split-media" style="background-image: url('${s.media}')">
            <div class="media-caption">📸 ${s.caption || 'Foto Oficial'}</div>
          </div>
        `;

        slideEl.innerHTML = s.type === 'split_rev' ? (mediaCol + textCol) : (textCol + mediaCol);
      } else if (s.type === 'finance') {
        slideEl.className += ' slide-split';
        slideEl.innerHTML = `
          <div class="split-text">
            <div class="slide-category">${s.category}</div>
            <h2 class="slide-title">${s.title}</h2>
            <p class="slide-desc">${s.desc}</p>
            <table class="finance-table">
              <thead>
                <tr>
                  <th>Tipologia</th>
                  <th>Área Privativa</th>
                  <th>Preço Médio m²</th>
                  <th>Fluxo Obra</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><strong>Residences</strong></td>
                  <td>84 m² a 276 m²</td>
                  <td>R$ 13.890 a R$ 17.500</td>
                  <td>35% em 36x sem juros</td>
                </tr>
                <tr>
                  <td><strong>Private Houses</strong></td>
                  <td>Casas com Piscina</td>
                  <td>Sob Consulta</td>
                  <td>Personalizado</td>
                </tr>
                <tr>
                  <td><strong>Studios</strong></td>
                  <td>21 m² a 57 m²</td>
                  <td>R$ 14.500 a R$ 18.000</td>
                  <td>35% em 36x sem juros</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="split-media" style="background-image: url('${s.media}')">
            <div class="media-caption">🏛️ Fachada Oficial Jardim da Hípica</div>
          </div>
        `;
      } else if (s.type === 'contact') {
        slideEl.className += ' slide-split';
        slideEl.innerHTML = `
          <div class="split-text">
            <div class="slide-category">${s.category}</div>
            <h2 class="slide-title">${s.title}</h2>
            <p class="slide-desc">${s.desc}</p>
            <div style="margin-top:20px; display:flex; flex-direction:column; gap:12px;">
              <div style="font-size:16px; color:#fff;">👤 <strong>Pedro Soares</strong> (${s.creci})</div>
              <div style="font-size:15px; color:var(--gold-light);">📱 <strong>WhatsApp:</strong> ${s.phone}</div>
              <div style="font-size:14px; color:var(--text-muted);">✉️ <strong>E-mail:</strong> ${s.email}</div>
            </div>
            <div style="margin-top:28px;">
              <a href="https://wa.me/5511966105952" target="_blank" class="btn-action btn-action-gold" style="display:inline-flex; padding:12px 24px; font-size:15px;">
                💬 Conversar Diretamente no WhatsApp
              </a>
            </div>
          </div>
          <div class="split-media" style="background-image: url('${s.brokerPhoto}')">
            <div class="media-caption">Pedro Soares • Lavvi Private Wealth</div>
          </div>
        `;
      }

      viewport.appendChild(slideEl);
      document.getElementById('slideCounter').innerText = `Slide ${idx + 1} de ${slides.length}`;
    }

    function nextSlide() {
      const slides = PROJECTS_DECK_DATA[currentProjKey].slides;
      if (currentSlideIdx < slides.length - 1) {
        renderSlide(currentSlideIdx + 1);
      }
    }

    function prevSlide() {
      if (currentSlideIdx > 0) {
        renderSlide(currentSlideIdx - 1);
      }
    }

    function switchProject(key) {
      currentProjKey = key;
      renderSlide(0);
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullScreen();
      }
    });

    // Touch swipe navigation
    let touchStartX = 0;
    window.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
    window.addEventListener('touchend', e => {
      let diff = touchStartX - e.changedTouches[0].clientX;
      if (diff > 50) nextSlide();
      if (diff < -50) prevSlide();
    });

    // Initialize
    renderSlide(0);
  </script>
</body>
</html>
